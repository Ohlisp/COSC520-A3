[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cosc520-a3"
version = "0.1.0"
description = "Vertex-cover and graph-coloring approximation benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["src"]
py-modules = ["run_benchmark"]
